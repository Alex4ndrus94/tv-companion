<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f14">
<title>TV Companion</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0c0f14;
    --bg-panel:#161b24;
    --bg-panel-2:#1d2330;
    --ink:#e8e6e1;
    --ink-dim:#9aa2b1;
    --gold:#e3a544;
    --gold-dim:#8a672c;
    --teal:#3fa9a0;
    --line:#242b3a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg-void); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; height:100%;}
  body{display:flex; flex-direction:column; min-height:100vh; padding-bottom:env(safe-area-inset-bottom);}
  h1,h2,h3,.display{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.04em;}
  header.top{
    padding:18px 18px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; background:var(--bg-void); z-index:10;
    padding-top:calc(18px + env(safe-area-inset-top));
  }
  header.top .brand{display:flex; align-items:center; gap:10px;}
  header.top .bulb{width:10px; height:10px; border-radius:50%; background:var(--gold);
    box-shadow:0 0 8px var(--gold);}
  header.top h1{font-size:18px; margin:0; font-weight:600;}
  main{flex:1; padding:16px; padding-bottom:90px; overflow-y:auto;}
  .view{display:none;}
  .view.active{display:block;}
  .search-bar{display:flex; gap:8px; margin-bottom:16px;}
  .search-bar input{
    flex:1; background:var(--bg-panel); border:1px solid var(--line); color:var(--ink);
    padding:12px 14px; border-radius:10px; font-size:15px; font-family:'Inter';
  }
  .search-bar button{
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--gold);
    border-radius:10px; padding:0 16px; font-family:'Oswald'; letter-spacing:.04em;
  }
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .poster-card{cursor:pointer;}
  .poster-card img{width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:8px;
    background:var(--bg-panel); display:block; border:1px solid var(--line);}
  .poster-card .t{font-size:11px; color:var(--ink-dim); margin-top:4px; line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .empty{color:var(--ink-dim); font-size:14px; text-align:center; padding:40px 20px; line-height:1.6;}
  .ticket{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:12px;
    padding:14px; margin-bottom:10px; display:flex; gap:12px; position:relative;
    overflow:hidden;
  }
  .ticket::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--gold);
  }
  .ticket img{width:52px; height:78px; object-fit:cover; border-radius:6px; flex-shrink:0;
    background:var(--bg-panel-2);}
  .ticket .info{flex:1; min-width:0;}
  .ticket .info h3{font-size:14px; margin:0 0 4px; font-weight:600; text-transform:none;
    letter-spacing:0; font-family:'Inter';}
  .ticket .meta{font-size:12px; color:var(--ink-dim); margin:0 0 6px;}
  .ticket .badge{
    display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.05em;
    padding:3px 8px; border-radius:20px; font-family:'Oswald'; font-weight:600;
  }
  .badge.watching{background:rgba(227,165,68,.15); color:var(--gold);}
  .badge.planned{background:rgba(154,162,177,.15); color:var(--ink-dim);}
  .badge.completed{background:rgba(63,169,160,.15); color:var(--teal);}
  .ticket .actions{display:flex; gap:6px; margin-top:8px;}
  .ticket .actions button{
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--ink);
    font-size:11px; padding:5px 9px; border-radius:6px; font-family:'Inter';
  }
  .ticket .date-chip{
    font-family:'Oswald'; font-size:11px; color:var(--gold); border:1px solid var(--gold-dim);
    padding:3px 8px; border-radius:6px; white-space:nowrap; align-self:flex-start;
  }
  .section-label{
    font-size:12px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.08em;
    margin:18px 0 8px; font-family:'Oswald';
  }
  .section-label:first-child{margin-top:0;}
  .tabs{display:flex; gap:8px; margin-bottom:14px;}
  .tabs button{
    flex:1; background:var(--bg-panel); border:1px solid var(--line); color:var(--ink-dim);
    padding:8px; border-radius:8px; font-size:12px; font-family:'Oswald'; letter-spacing:.04em;
  }
  .tabs button.active{background:var(--bg-panel-2); color:var(--gold); border-color:var(--gold-dim);}
  nav.bottom{
    position:fixed; bottom:0; left:0; right:0; background:var(--bg-void);
    border-top:1px solid var(--line); display:flex; z-index:10;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.bottom button{
    flex:1; background:none; border:none; color:var(--ink-dim); padding:12px 4px 10px;
    display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10px;
    font-family:'Oswald'; text-transform:uppercase; letter-spacing:.04em;
  }
  nav.bottom button.active{color:var(--gold);}
  nav.bottom .icon{width:20px; height:20px; display:block;}
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:20; display:none;
  }
  .sheet-backdrop.open{display:block;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; background:var(--bg-panel);
    border-radius:18px 18px 0 0; padding:20px; max-height:82vh; overflow-y:auto;
    transform:translateY(100%); transition:transform .25s ease; z-index:21;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  .sheet.open{transform:translateY(0);}
  .sheet .close{position:absolute; right:16px; top:16px; background:none; border:none;
    color:var(--ink-dim); font-size:20px;}
  .sheet .head{display:flex; gap:14px; margin-bottom:14px;}
  .sheet .head img{width:90px; height:135px; object-fit:cover; border-radius:8px;
    background:var(--bg-panel-2);}
  .sheet h2{font-size:18px; margin:0 0 6px; text-transform:none; letter-spacing:0;}
  .sheet .overview{font-size:13px; color:var(--ink-dim); line-height:1.5; margin:10px 0;}
  .status-row{display:flex; gap:8px; margin:14px 0;}
  .status-row button{
    flex:1; background:var(--bg-panel-2); border:1px solid var(--line); color:var(--ink);
    padding:10px; border-radius:8px; font-size:12px; font-family:'Oswald'; letter-spacing:.03em;
  }
  .status-row button.active{background:var(--gold); color:#1a1305; border-color:var(--gold);}
  .ep-list{margin-top:14px;}
  .ep-row{display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .ep-row .num{color:var(--ink-dim);}
  .ep-row button{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--line);
    background:var(--bg-panel-2); color:var(--ink-dim); font-size:13px;
  }
  .ep-row button.done{background:var(--teal); border-color:var(--teal); color:#08211f;}
  .season-select{
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--ink);
    padding:8px 10px; border-radius:8px; font-family:'Inter'; margin-top:8px;
  }
  .bulk-actions{display:flex; gap:8px; margin-top:10px;}
  .bulk-actions button{
    flex:1; background:var(--bg-panel-2); border:1px solid var(--line); color:var(--ink);
    font-size:12px; padding:9px; border-radius:8px; font-family:'Oswald'; letter-spacing:.03em;
  }
  .bulk-actions button.mark{color:var(--teal); border-color:var(--teal);}
  .toast{
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--bg-panel-2); border:1px solid var(--gold-dim); color:var(--ink);
    padding:10px 16px; border-radius:10px; font-size:13px; opacity:0; transition:.25s;
    pointer-events:none; z-index:30;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="bulb"></span><h1>TV Companion</h1></div>
</header>

<main>
  <section class="view" id="view-calendar">
    <div class="section-label">Prossime uscite</div>
    <div id="calendarList"></div>
    <div class="section-label" id="noDateLabel" style="display:none;">Senza data confermata</div>
    <div id="noDateList"></div>
  </section>

  <section class="view" id="view-search">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Cerca una serie TV..." autocomplete="off">
      <button id="searchBtn">Cerca</button>
    </div>
    <div class="grid" id="searchResults"></div>
  </section>

  <section class="view" id="view-library">
    <div class="tabs" id="libTabs">
      <button data-status="watching" class="active">In corso</button>
      <button data-status="planned">Da vedere</button>
      <button data-status="completed">Completate</button>
    </div>
    <div id="libraryList"></div>
  </section>
</main>

<nav class="bottom">
  <button data-view="calendar" class="active">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    Calendario
  </button>
  <button data-view="search">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    Cerca
  </button>
  <button data-view="library">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 3v5h5"/></svg>
    Libreria
  </button>
</nav>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <button class="close" id="sheetClose">&times;</button>
  <div id="sheetContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "https://api.tvmaze.com";
let library = JSON.parse(localStorage.getItem("tv_library") || "{}");

function saveLibrary(){ localStorage.setItem("tv_library", JSON.stringify(library)); }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}
function stripHtml(html){
  if(!html) return "";
  const d = document.createElement("div");
  d.innerHTML = html;
  return d.textContent || "";
}

// ---------- View / nav ----------
function showView(name){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.querySelectorAll("nav.bottom button").forEach(b=>b.classList.toggle("active", b.dataset.view===name));
  const el = document.getElementById("view-"+name);
  if(el) el.classList.add("active");
  if(name==="calendar") renderCalendar();
  if(name==="library") renderLibrary();
}
document.querySelectorAll("nav.bottom button").forEach(b=>{
  b.addEventListener("click", ()=>showView(b.dataset.view));
});

// ---------- TVMaze ----------
async function tvmaze(path){
  const res = await fetch(API + path);
  if(!res.ok) throw new Error("TVMaze error " + res.status);
  return res.json();
}

// ---------- Search ----------
async function doSearch(){
  const q = document.getElementById("searchInput").value.trim();
  const resultsEl = document.getElementById("searchResults");
  if(!q){ resultsEl.innerHTML = ""; return; }
  resultsEl.innerHTML = "<div class='empty'>Cerco...</div>";
  try{
    const data = await tvmaze("/search/shows?q=" + encodeURIComponent(q));
    if(!data.length){ resultsEl.innerHTML = "<div class='empty'>Nessun risultato</div>"; return; }
    resultsEl.innerHTML = "";
    data.forEach(({show})=>{
      const poster = show.image ? show.image.medium : "";
      const card = document.createElement("div");
      card.className = "poster-card";
      card.innerHTML = `${poster?`<img src="${poster}" alt="">`:`<div style="aspect-ratio:2/3;background:var(--bg-panel);border-radius:8px;border:1px solid var(--line);"></div>`}<div class="t">${show.name}</div>`;
      card.addEventListener("click", ()=>openDetail(show.id));
      resultsEl.appendChild(card);
    });
  }catch(e){
    resultsEl.innerHTML = "<div class='empty'>Errore nella ricerca. Riprova tra poco.</div>";
  }
}
document.getElementById("searchBtn").addEventListener("click", doSearch);
document.getElementById("searchInput").addEventListener("keydown", e=>{ if(e.key==="Enter") doSearch(); });

// ---------- Detail sheet ----------
const sheet = document.getElementById("sheet");
const sheetBackdrop = document.getElementById("sheetBackdrop");
function closeSheet(){ sheet.classList.remove("open"); sheetBackdrop.classList.remove("open"); }
document.getElementById("sheetClose").addEventListener("click", closeSheet);
sheetBackdrop.addEventListener("click", closeSheet);

async function openDetail(id, seasonToShow){
  const content = document.getElementById("sheetContent");
  content.innerHTML = "<div class='empty'>Carico...</div>";
  sheet.classList.add("open"); sheetBackdrop.classList.add("open");
  try{
    const show = await tvmaze(`/shows/${id}?embed[]=nextepisode&embed[]=previousepisode`);
    const key = "tv_" + id;
    const entry = library[key];
    const poster = show.image ? show.image.medium : "";
    const nextEp = show._embedded && show._embedded.nextepisode;

    const statusHtml = `
      <div class="status-row">
        <button data-s="planned">Da vedere</button>
        <button data-s="watching">In corso</button>
        <button data-s="completed">Completata</button>
      </div>`;

    content.innerHTML = `
      <div class="head">
        ${poster?`<img src="${poster}">`:""}
        <div>
          <h2>${show.name}</h2>
          <div class="meta">${(show.premiered||"").slice(0,4)} · ${show.status||""}</div>
          ${nextEp ? `<div class="date-chip">Prossimo: S${nextEp.season}E${nextEp.number} · ${nextEp.airdate}</div>` : ""}
        </div>
      </div>
      <div class="overview">${stripHtml(show.summary) || "Nessuna trama disponibile."}</div>
      ${statusHtml}
      <div class="bulk-actions">
        <button class="mark" id="markShowBtn">Segna tutta la serie vista</button>
      </div>
      <select class="season-select" id="seasonSelect"></select>
      <div class="bulk-actions">
        <button class="mark" id="markSeasonBtn">Segna stagione vista</button>
        <button id="unmarkSeasonBtn">Azzera stagione</button>
      </div>
      <div class="ep-list" id="epList"><div class="empty">Carico episodi...</div></div>
    `;

    content.querySelectorAll(".status-row button").forEach(btn=>{
      if(entry && entry.status===btn.dataset.s) btn.classList.add("active");
      btn.addEventListener("click", ()=>{
        library[key] = library[key] || {title:show.name, poster, watchedEpisodes:[], addedAt:Date.now()};
        library[key].status = btn.dataset.s;
        library[key].nextEpisode = nextEp ? {season:nextEp.season, number:nextEp.number, airdate:nextEp.airdate} : null;
        saveLibrary();
        content.querySelectorAll(".status-row button").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        toast("Aggiornato");
      });
    });

    const allEpisodes = await tvmaze(`/shows/${id}/episodes`);
    const seasons = [...new Set(allEpisodes.map(e=>e.season))].sort((a,b)=>a-b);
    const seasonSelect = document.getElementById("seasonSelect");
    const startSeason = seasonToShow || (entry && entry.currentSeason) || seasons[0] || 1;
    seasonSelect.innerHTML = seasons.map(s=>`<option value="${s}" ${s===startSeason?"selected":""}>Stagione ${s}</option>`).join("");

    function loadSeason(snum){
      const epList = document.getElementById("epList");
      const watched = (library[key] && library[key].watchedEpisodes) || [];
      const episodes = allEpisodes.filter(e=>e.season===snum);
      epList.innerHTML = "";
      episodes.forEach(ep=>{
        const isWatched = watched.some(w=>w.season===snum && w.episode===ep.number);
        const row = document.createElement("div");
        row.className = "ep-row";
        row.innerHTML = `<span class="num">E${ep.number} · ${ep.name||""} ${ep.airdate?("· "+ep.airdate):""}</span>
          <button class="${isWatched?'done':''}">${isWatched?'✓':''}</button>`;
        row.querySelector("button").addEventListener("click", (e)=>{
          library[key] = library[key] || {title:show.name, poster, status:"watching", watchedEpisodes:[], addedAt:Date.now()};
          const w = library[key].watchedEpisodes;
          const idx = w.findIndex(x=>x.season===snum && x.episode===ep.number);
          if(idx>-1){ w.splice(idx,1); e.target.classList.remove("done"); e.target.textContent=""; }
          else{ w.push({season:snum, episode:ep.number}); e.target.classList.add("done"); e.target.textContent="✓"; }
          library[key].currentSeason = snum;
          saveLibrary();
        });
        epList.appendChild(row);
      });
    }
    seasonSelect.addEventListener("change", ()=>loadSeason(parseInt(seasonSelect.value)));

    document.getElementById("markShowBtn").addEventListener("click", ()=>{
      library[key] = library[key] || {title:show.name, poster, watchedEpisodes:[], addedAt:Date.now()};
      library[key].status = "completed";
      const w = library[key].watchedEpisodes;
      allEpisodes.forEach(ep=>{
        if(!w.some(x=>x.season===ep.season && x.episode===ep.number)) w.push({season:ep.season, episode:ep.number});
      });
      saveLibrary();
      content.querySelectorAll(".status-row button").forEach(b=>b.classList.toggle("active", b.dataset.s==="completed"));
      loadSeason(parseInt(seasonSelect.value));
      toast("Tutta la serie segnata come vista");
    });

    document.getElementById("markSeasonBtn").addEventListener("click", ()=>{
      const snum = parseInt(seasonSelect.value);
      library[key] = library[key] || {title:show.name, poster, status:"watching", watchedEpisodes:[], addedAt:Date.now()};
      const seasonEpNums = allEpisodes.filter(e=>e.season===snum).map(e=>e.number);
      const w = library[key].watchedEpisodes;
      seasonEpNums.forEach(num=>{
        if(!w.some(x=>x.season===snum && x.episode===num)) w.push({season:snum, episode:num});
      });
      library[key].currentSeason = snum;
      saveLibrary();
      loadSeason(snum);
      toast("Stagione " + snum + " segnata come vista");
    });

    document.getElementById("unmarkSeasonBtn").addEventListener("click", ()=>{
      const snum = parseInt(seasonSelect.value);
      if(!library[key]) return;
      library[key].watchedEpisodes = library[key].watchedEpisodes.filter(x=>x.season!==snum);
      saveLibrary();
      loadSeason(snum);
      toast("Stagione " + snum + " azzerata");
    });

    loadSeason(startSeason);
  }catch(e){
    content.innerHTML = "<div class='empty'>Errore nel caricamento.</div>";
  }
}

// ---------- Library view ----------
let currentLibTab = "watching";
document.querySelectorAll("#libTabs button").forEach(b=>{
  b.addEventListener("click", ()=>{
    currentLibTab = b.dataset.status;
    document.querySelectorAll("#libTabs button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    renderLibrary();
  });
});

function renderLibrary(){
  const list = document.getElementById("libraryList");
  const entries = Object.entries(library).filter(([k,v])=>v.status===currentLibTab);
  if(!entries.length){ list.innerHTML = "<div class='empty'>Niente qui. Cerca una serie e aggiungila alla libreria.</div>"; return; }
  list.innerHTML = "";
  entries.forEach(([key, v])=>{
    const id = key.split("_")[1];
    const nextInfo = v.nextEpisode ? `Prossimo: S${v.nextEpisode.season}E${v.nextEpisode.number} · ${v.nextEpisode.airdate}` : "";
    const div = document.createElement("div");
    div.className = "ticket";
    div.innerHTML = `
      ${v.poster?`<img src="${v.poster}">`:""}
      <div class="info">
        <h3>${v.title}</h3>
        <div class="meta">${nextInfo}</div>
        <span class="badge ${v.status}">${v.status==="watching"?"In corso":v.status==="planned"?"Da vedere":"Completata"}</span>
        <div class="actions">
          <button data-action="open">Apri</button>
          <button data-action="remove">Rimuovi</button>
        </div>
      </div>
    `;
    div.querySelector('[data-action="open"]').addEventListener("click", ()=>openDetail(parseInt(id)));
    div.querySelector('[data-action="remove"]').addEventListener("click", ()=>{
      delete library[key]; saveLibrary(); renderLibrary(); toast("Rimossa dalla libreria");
    });
    list.appendChild(div);
  });
}

// ---------- Calendar view ----------
function renderCalendar(){
  const calList = document.getElementById("calendarList");
  const noDateList = document.getElementById("noDateList");
  const noDateLabel = document.getElementById("noDateLabel");
  const withDate = [];
  const withoutDate = [];
  Object.entries(library).forEach(([key, v])=>{
    if(v.status !== "watching") return;
    const id = key.split("_")[1];
    if(v.nextEpisode && v.nextEpisode.airdate){
      withDate.push({key, id, title:v.title, poster:v.poster, date:v.nextEpisode.airdate, label:`S${v.nextEpisode.season}E${v.nextEpisode.number}`});
    } else {
      withoutDate.push({key, id, title:v.title, poster:v.poster});
    }
  });
  withDate.sort((a,b)=>a.date.localeCompare(b.date));

  if(!withDate.length){
    calList.innerHTML = "<div class='empty'>Nessuna uscita in programma. Aggiungi serie \"in corso\" dalla libreria.</div>";
  } else {
    calList.innerHTML = "";
    withDate.forEach(item=>{
      const div = document.createElement("div");
      div.className = "ticket";
      div.innerHTML = `
        ${item.poster?`<img src="${item.poster}">`:""}
        <div class="info">
          <h3>${item.title}</h3>
          <div class="meta">${item.label}</div>
        </div>
        <div class="date-chip">${item.date}</div>
      `;
      div.addEventListener("click", ()=>openDetail(parseInt(item.id)));
      calList.appendChild(div);
    });
  }

  if(withoutDate.length){
    noDateLabel.style.display = "block";
    noDateList.innerHTML = "";
    withoutDate.forEach(item=>{
      const div = document.createElement("div");
      div.className = "ticket";
      div.innerHTML = `${item.poster?`<img src="${item.poster}">`:""}<div class="info"><h3>${item.title}</h3><div class="meta">Data non ancora annunciata</div></div>`;
      div.addEventListener("click", ()=>openDetail(parseInt(item.id)));
      noDateList.appendChild(div);
    });
  } else {
    noDateLabel.style.display = "none"; noDateList.innerHTML = "";
  }
}

// ---------- Boot ----------
showView("calendar");

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
